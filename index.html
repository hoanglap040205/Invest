<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Đầu Tư Chứng Khoán</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e3e6ec;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--text:#e7eaf0;--muted:#8d96a8;--line:#2c3340;--accent:#5b8cff;--ok:#34d399;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto}
h1{font-size:20px;margin:0}
#sync{font-size:13px;color:var(--muted)}
nav{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.task{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{margin-top:4px;width:18px;height:18px;flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task small{color:var(--muted);display:block}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
button.p{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.entry{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse}
td,th{border-top:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;font-size:14px}
th{color:var(--muted);font-weight:600}
.today{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chart{display:flex;gap:6px;align-items:flex-end;height:110px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.chart i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>📈 Học Đầu Tư Chứng Khoán</h1>
  <div id="sync">Chưa kết nối GitHub (đang lưu trên trình duyệt)</div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
// ===== Lộ trình (lấy từ file "Lộ trình đầu tư chứng khoán.txt") =====
const ROADMAP = [
 {m:"Tháng 1: Nền tảng và mở tài khoản", items:[
  ["t1w1","Tuần 1: Hiểu thị trường","Cổ phiếu, VN-Index, VN30, HOSE/HNX/UPCoM, T+2, biên độ, lệnh LO/ATO/ATC/MP. Mở tài khoản eKYC."],
  ["t1w2","Tuần 2: Làm quen công cụ","Cài app giao dịch, CafeF/Vietstock/FireAnt/Simplize. Lập watchlist 10 mã VN30."],
  ["t1w3","Tuần 3-4: Đọc tin và vĩ mô","15 phút/ngày đọc tin; lãi suất, tỷ giá, khối ngoại. Sách: Nhà đầu tư thông minh."]]},
 {m:"Tháng 2: Phân tích cơ bản", items:[
  ["t2w5","Tuần 5-6: Báo cáo tài chính","3 loại báo cáo; đọc VNM và FPT, so sánh 5 năm."],
  ["t2w7","Tuần 7: Định giá","EPS, P/E, P/B, ROE, nợ/vốn chủ, cổ tức; so sánh VCB, TCB, MBB."],
  ["t2w8","Tuần 8: Phân tích ngành","Viết 1 trang phân tích 1 cổ phiếu. Sách: Cổ phiếu thường, lợi nhuận phi thường."]]},
 {m:"Tháng 3: Kỹ thuật và quản lý rủi ro", items:[
  ["t3w9","Tuần 9-10: Phân tích kỹ thuật","Nến Nhật, xu hướng, hỗ trợ/kháng cự, MA, RSI, MACD trên TradingView."],
  ["t3w11","Tuần 11: Quản lý vốn","Tối đa 20-25% vốn/mã, cắt lỗ -7% đến -8%, hiểu rủi ro margin."],
  ["t3w12","Tuần 12: Giao dịch giả lập","Ghi chép giao dịch trên giấy 2-4 tuần. Sách: Làm giàu từ chứng khoán."]]},
 {m:"Tháng 4-6: Đầu tư thật vốn nhỏ", items:[
  ["t4s1","Bước 1: Chọn vốn khởi đầu","Số tiền mất 30% vẫn ổn (10-30 triệu); giữ riêng quỹ dự phòng 3-6 tháng."],
  ["t4s2","Bước 2: Phân bổ","50-60% ETF VN30, 30-40% 2-3 cổ phiếu tự phân tích, 10-20% tiền mặt."],
  ["t4s3","Bước 3: Mua định kỳ (DCA)","Mỗi tháng trích khoản cố định mua ETF."],
  ["t4s4","Bước 4: Nhật ký và tổng kết","Sau 6 tháng so sánh với VN-Index; nếu thua, tăng tỷ trọng ETF."]]}
];
const ALL = ROADMAP.flatMap(g=>g.items);
const SCHEDULE = [
 ["Thứ 2 - Thứ 6 (2 tiếng)","20' đọc tin + ghi lý do VN-Index tăng/giảm · 70' học lý thuyết · 30' thực hành và tóm tắt"],
 ["Thứ 7 (4 tiếng)","2,5h bài tập lớn của tuần · 1,5h đọc sách"],
 ["Chủ nhật (4 tiếng)","1,5h đọc sách · 1h ôn tập · 1h tổng kết tuần và lên kế hoạch · 30' dự phòng"]];
const DAY_GOAL = d => (d===0||d===6) ? 240 : 120; // phút

// ===== Trạng thái =====
const LS="invest-state", CFG="invest-gh";
let state = {done:{}, logs:[], notes:[]};
let cfg = JSON.parse(localStorage.getItem(CFG)||"{}"); // {repo, token, branch}
let sha = null, tab = "home", saveTimer=null;
const $ = s=>document.querySelector(s);
const today = ()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = m=>`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`;

// ===== GitHub làm server =====
const api = ()=>`https://api.github.com/repos/${cfg.repo}/contents/data.json`;
const hdr = ()=>({Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json"});
const b64e = s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d = s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const setSync = t=>$("#sync").textContent=t;
const why = c=>({"401":"token sai hoặc đã hết hạn","403":"token chưa có quyền Contents: Read and write","404":"không tìm thấy repo, kiểm tra tên repo và repo đã được chọn cho token"}[c]||"mã "+c);

async function pull(){
  if(!cfg.repo||!cfg.token) return;
  setSync("Đang tải từ GitHub…");
  try{
    const r = await fetch(api()+(cfg.branch?`?ref=${cfg.branch}`:""),{headers:hdr(),cache:"no-store"});
    if(r.status===404){ sha=null; setSync("Repo chưa có data.json, sẽ tạo khi lưu"); return; }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(); sha=j.sha;
    state = Object.assign({done:{},logs:[],notes:[]}, JSON.parse(b64d(j.content)));
    localStorage.setItem(LS,JSON.stringify(state));
    setSync("✓ Đã đồng bộ GitHub"); render();
  }catch(e){ setSync("⚠ Lỗi tải GitHub: "+why(e.message)+". Đang dùng dữ liệu trên máy"); }
}
async function push(retry=true){
  if(!cfg.repo||!cfg.token) return;
  setSync("Đang lưu lên GitHub…");
  try{
    const body={message:"Cập nhật tiến độ học "+new Date().toISOString(),content:b64e(JSON.stringify(state,null,2))};
    if(sha) body.sha=sha; if(cfg.branch) body.branch=cfg.branch;
    const r = await fetch(api(),{method:"PUT",headers:hdr(),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      if(retry){ const g=await fetch(api()+(cfg.branch?`?ref=${cfg.branch}`:""),{headers:hdr(),cache:"no-store"}); if(g.ok){sha=(await g.json()).sha; return push(false);} }
    }
    if(!r.ok) throw new Error(r.status);
    sha=(await r.json()).content.sha; setSync("✓ Đã lưu lên GitHub");
  }catch(e){ setSync("⚠ Lưu GitHub thất bại: "+why(e.message)+". Dữ liệu vẫn nằm trên máy"); }
}
function save(){
  localStorage.setItem(LS,JSON.stringify(state));
  clearTimeout(saveTimer); saveTimer=setTimeout(push,1200);
}

// ===== Tính toán =====
const minutesOn = d => state.logs.filter(l=>l.date===d).reduce((a,l)=>a+l.min,0);
function streak(){
  let n=0, d=new Date(today());
  if(!minutesOn(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(minutesOn(d.toISOString().slice(0,10))>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function last7(){
  return [...Array(7)].map((_,i)=>{ const d=new Date(today()); d.setDate(d.getDate()-(6-i));
    const k=d.toISOString().slice(0,10); return {k,day:d.getDay(),min:minutesOn(k)}; });
}

// ===== Giao diện =====
const TABS=[["home","Tổng quan"],["road","Lộ trình"],["log","Nhật ký học"],["notes","Ghi chú"],["plan","Lịch học"],["set","Cài đặt GitHub"]];
function renderNav(){ $("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?"on":""}" data-t="${k}">${n}</button>`).join(""); }
document.addEventListener("click",e=>{ const t=e.target.dataset?.t; if(t){tab=t;render();} });

function render(){ renderNav(); ({home,road,log,notes,plan,set}[tab])(); }

function home(){
  const done=ALL.filter(x=>state.done[x[0]]).length, pct=Math.round(done/ALL.length*100);
  const wk=last7(), wkMin=wk.reduce((a,x)=>a+x.min,0), td=minutesOn(today()), goal=DAY_GOAL(new Date().getDay());
  const max=Math.max(60,...wk.map(x=>x.min));
  const next=ALL.find(x=>!state.done[x[0]]);
  $("#main").innerHTML=`
  <div class="grid">
   <div class="card stat"><b>${pct}%</b><span>Hoàn thành lộ trình (${done}/${ALL.length})</span><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="card stat"><b>${fmt(td)}</b><span>Hôm nay / mục tiêu ${fmt(goal)}</span><div class="bar"><i style="width:${Math.min(100,td/goal*100)}%"></i></div></div>
   <div class="card stat"><b>${fmt(wkMin)}</b><span>7 ngày gần nhất</span></div>
   <div class="card stat"><b>🔥 ${streak()}</b><span>Ngày học liên tiếp</span></div>
  </div>
  <div class="card"><h2>7 ngày gần nhất</h2><div class="chart">${wk.map(x=>`<div><i style="height:${x.min/max*90}px"></i>${["CN","T2","T3","T4","T5","T6","T7"][x.day]}<br>${x.min}'</div>`).join("")}</div></div>
  <div class="card"><h2>Việc tiếp theo</h2>${next?`<b>${esc(next[1])}</b><p class="muted">${esc(next[2])}</p>`:"🎉 Bạn đã hoàn thành toàn bộ lộ trình!"}</div>`;
}

function road(){
  $("#main").innerHTML=ROADMAP.map(g=>{
    const d=g.items.filter(x=>state.done[x[0]]).length;
    return `<div class="card"><h2>${g.m} <span class="muted">(${d}/${g.items.length})</span></h2>`+
    g.items.map(([id,t,desc])=>`<label class="task ${state.done[id]?"done":""}"><input type="checkbox" data-id="${id}" ${state.done[id]?"checked":""}><div><span class="t">${esc(t)}</span><small>${esc(desc)}</small></div></label>`).join("")+`</div>`;
  }).join("");
  document.querySelectorAll("input[data-id]").forEach(c=>c.onchange=()=>{
    if(c.checked) state.done[c.dataset.id]=today(); else delete state.done[c.dataset.id];
    save(); road();
  });
}

function log(){
  const logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,60);
  $("#main").innerHTML=`
  <div class="card"><h2>Ghi buổi học</h2>
   <div class="row"><input type="date" id="ld" value="${today()}"><input type="number" id="lm" placeholder="Số phút" min="1" value="60">
   <select id="lt">${ALL.map(x=>`<option>${esc(x[1])}</option>`).join("")}<option>Khác</option></select></div>
   <textarea id="ln" placeholder="Hôm nay học được gì? Còn chỗ nào chưa hiểu?"></textarea>
   <p><button class="p" id="ladd">Thêm</button></p></div>
  <div class="card"><h2>Lịch sử</h2>${logs.length?logs.map(l=>`<div class="entry"><div><b>${l.date}</b> · ${l.min} phút · ${esc(l.topic)}<p class="muted">${esc(l.note||"")}</p></div><button class="g" data-del="${l.id}">Xóa</button></div>`).join(""):'<p class="muted">Chưa có buổi học nào.</p>'}</div>`;
  $("#ladd").onclick=()=>{
    const min=+$("#lm").value; if(!min) return;
    state.logs.push({id:Date.now(),date:$("#ld").value,min,topic:$("#lt").value,note:$("#ln").value.trim()});
    save(); log();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ state.logs=state.logs.filter(l=>l.id!=b.dataset.del); save(); log(); });
}

function notes(){
  const ns=[...state.notes].sort((a,b)=>b.id-a.id);
  $("#main").innerHTML=`
  <div class="card"><h2>Ghi chú / nhật ký đầu tư</h2>
   <input type="text" id="nt" placeholder="Tiêu đề (vd: Phân tích FPT, bài học tuần 3…)" style="margin-bottom:8px">
   <textarea id="nb" placeholder="Nội dung…"></textarea><p><button class="p" id="nadd">Lưu ghi chú</button></p></div>
  ${ns.map(n=>`<div class="card"><div class="entry" style="border:0;padding:0"><div><b>${esc(n.title||"(không tiêu đề)")}</b> <span class="muted">${n.date}</span><p>${esc(n.body)}</p></div><button class="g" data-nd="${n.id}">Xóa</button></div></div>`).join("")}`;
  $("#nadd").onclick=()=>{ const body=$("#nb").value.trim(); if(!body) return;
    state.notes.push({id:Date.now(),date:today(),title:$("#nt").value.trim(),body}); save(); notes(); };
  document.querySelectorAll("[data-nd]").forEach(b=>b.onclick=()=>{ state.notes=state.notes.filter(n=>n.id!=b.dataset.nd); save(); notes(); });
}

function plan(){
  const dow=new Date().getDay();
  $("#main").innerHTML=`<div class="card"><h2>Khung lịch mỗi tuần (~18 tiếng)</h2><table>${SCHEDULE.map(([d,t],i)=>{
    const on=(i===0&&dow>=1&&dow<=5)||(i===1&&dow===6)||(i===2&&dow===0);
    return `<tr class="${on?"today":""}"><th>${d}${on?" ← hôm nay":""}</th><td>${t}</td></tr>`;}).join("")}</table></div>`;
}

function set(){
  $("#main").innerHTML=`<div class="card"><h2>Kết nối GitHub</h2>
  <p class="muted">Dữ liệu được lưu thành <code>data.json</code> trong repo của bạn. Token chỉ lưu trong trình duyệt này, không đưa vào code.</p>
  <div class="row"><input type="text" id="cr" placeholder="tên-github/tên-repo" value="${esc(cfg.repo||"")}"><input type="text" id="cb" placeholder="branch (để trống = mặc định)" value="${esc(cfg.branch||"")}"></div>
  <input type="password" id="ct" placeholder="Personal Access Token (quyền Contents: Read and write)" value="${esc(cfg.token||"")}" style="margin-bottom:8px">
  <p><button class="p" id="cs">Lưu và đồng bộ</button> <button class="g" id="cx">Ngắt kết nối</button></p></div>
  <div class="card"><h2>Cách lấy token</h2><p class="muted">GitHub → Settings → Developer settings → Fine-grained tokens → chọn đúng repo này → Permissions: <b>Contents = Read and write</b>.</p></div>`;
  $("#cs").onclick=async()=>{ cfg={repo:$("#cr").value.trim(),branch:$("#cb").value.trim(),token:$("#ct").value.trim()};
    localStorage.setItem(CFG,JSON.stringify(cfg)); await pull(); if(!sha) await push(); };
  $("#cx").onclick=()=>{ cfg={}; sha=null; localStorage.removeItem(CFG); setSync("Chưa kết nối GitHub (đang lưu trên trình duyệt)"); set(); };
}

// ===== Khởi động =====
try{ Object.assign(state,JSON.parse(localStorage.getItem(LS)||"{}")); }catch(e){}
render();
pull();
</script>
</body>
</html>
